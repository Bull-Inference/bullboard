[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bullboard"
version = "0.1.0"
description = "Terminal dashboard for Bull.inf — stalk $ANSEM + @blknoiz06 like Surfboard"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Bull Inference" }]
keywords = ["bullinf", "ansem", "solana", "tui", "terminal", "blknoiz", "inference"]
classifiers = [
  "Environment :: Console",
  "Topic :: Terminals",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "httpx>=0.27",
  "textual>=1.0",
]

[project.urls]
Homepage = "https://bullinf.fun"
Repository = "https://github.com/Bull-Inference/bullboard"

[project.scripts]
bullboard = "bullboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bullboard"]

[tool.hatch.build.targets.sdist]
include = ["src/bullboard", "README.md", "SPEC.md", "LICENSE", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
